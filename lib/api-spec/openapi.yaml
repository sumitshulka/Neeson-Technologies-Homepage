openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact form protection and enquiry submission
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact/captcha-config:
    get:
      operationId: getContactCaptchaConfig
      tags: [contact]
      summary: Get public CAPTCHA configuration
      responses:
        "200":
          description: Current CAPTCHA and delivery setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCaptchaConfig"
  /contact/enquiries:
    post:
      operationId: submitContactEnquiry
      tags: [contact]
      summary: Verify and forward a contact enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEnquiryInput"
      responses:
        "202":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnquiryAccepted"
        "400":
          description: Invalid form or CAPTCHA token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Contact receiver rejected the enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: CAPTCHA or contact delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactCaptchaConfig:
      type: object
      properties:
        siteKey:
          type: string
          minLength: 1
        captchaConfigured:
          type: boolean
        deliveryConfigured:
          type: boolean
      required:
        - captchaConfigured
        - deliveryConfigured
    ContactEnquiryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        company:
          type: string
          minLength: 1
          maxLength: 160
        role:
          type: string
          maxLength: 120
        question:
          type: string
          minLength: 10
          maxLength: 2000
        timing:
          type: string
          maxLength: 160
        website:
          type: string
          maxLength: 200
          description: Hidden honeypot field. Non-empty values are not forwarded.
        recaptchaToken:
          type: string
          minLength: 1
          maxLength: 2048
      required:
        - name
        - email
        - company
        - question
        - recaptchaToken
    ContactEnquiryAccepted:
      type: object
      properties:
        status:
          type: string
          enum: [accepted]
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

